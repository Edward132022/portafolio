<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edward García — Portafolio</title>
<meta name="description" content="Portafolio de Edward García, ingeniero en multimedia. Tomo una idea y la vuelvo real: la estructuro, la planeo y la construyo con código, hardware y diseño.">

<!-- Vista previa al compartir el link (LinkedIn, WhatsApp, etc.).
     og:image debe ser una URL COMPLETA (https://...) para que LinkedIn y
     WhatsApp la muestren; reemplazá https://edward132022.github.io/portafolio cuando esté publicado.
     Tamaño recomendado de preview.jpg: 1200 x 630 px, en la raíz del sitio. -->
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CO">
<meta property="og:title" content="Edward García — Portafolio">
<meta property="og:description" content="Ingeniero en multimedia. Experiencias interactivas, apps y web, y 3D. Tomo una idea y la vuelvo real.">
<meta property="og:image" content="https://edward132022.github.io/portafolio/preview.jpg">
<meta property="og:url" content="https://edward132022.github.io/portafolio/">
<meta name="twitter:card" content="summary_large_image">

<!-- Tipografías: Anton (títulos, estilo póster/brutalista),
     Archivo (texto de lectura, grotesk crudo), JetBrains Mono (HUD, etiquetas) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Todo el CSS vive en style.css -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ESTE ARCHIVO ES SOLO EL "CASCARÓN" DEL SITIO.
  El contenido de cada escena (Inicio, Sobre mí, Experiencias interactivas,
  Apps y web, Hardware, 3D y visual, Contacto) vive en archivos separados dentro
  de la carpeta /sections/. script.js los carga con fetch() y los inserta
  dentro de <div class="scenes" id="scenesContainer"> al abrir la página
  (ver script.js, sección 0 "CARGA DE SECCIONES").

  IMPORTANTE: fetch() para leer archivos locales necesita que el sitio se
  sirva desde un servidor (no funciona abriendo el .html con doble clic
  en algunos navegadores, por una restricción de seguridad llamada CORS).
  Para verlo mientras trabajás en tu compu, usá una extensión tipo
  "Live Server" en VS Code, o corré en esta carpeta:
      python3 -m http.server
  y abrí http://localhost:8000
  Una vez que subas estos archivos a un hosting real (Netlify, GitHub
  Pages, Vercel, etc.) va a funcionar sin ningún problema.
-->

<!-- Fondo cuadriculado decorativo -->
<div class="grid-bg"></div>

<!-- Canvas de la estela de luz (dibujado por script.js) -->
<canvas id="trailCanvas"></canvas>

<!-- Barrido de color en cada cambio de escena -->
<div class="wipe" id="wipe"></div>

<!-- HUD decorativo -->
<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>
<div class="hud-breadcrumb">EDWARD_GARCIA / render_engine<br>&gt; SCENE: <b id="breadcrumbScene">00_INICIO</b></div>
<div class="hud-gizmo spin" aria-hidden="true">
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4">
    <line x1="32" y1="32" x2="52" y2="24" /><line x1="32" y1="32" x2="14" y2="20" /><line x1="32" y1="32" x2="32" y2="54" />
    <circle cx="52" cy="24" r="3"/><circle cx="14" cy="20" r="3"/><circle cx="32" cy="54" r="3"/><circle cx="32" cy="32" r="2" fill="currentColor"/>
  </svg>
</div>
<div class="hud-readout">FOV 35MM&nbsp;&nbsp;·&nbsp;&nbsp;RES 1920×1080&nbsp;&nbsp;·&nbsp;&nbsp;FPS 60</div>

<div class="app">

  <!-- NAV: botones que llaman a goTo(id) en script.js. Sigue viviendo acá
       porque es parte del "cascarón" fijo, no de una escena individual. -->
  <nav class="nav" aria-label="Navegación de secciones">
    <button class="nav-item active" data-target="inicio" data-color="neutral">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6 10v9h12v-9"/></svg>
      <span class="lbl">Inicio</span><span class="dot"></span>
    </button>
    <button class="nav-item" data-target="sobre-mi" data-color="neutral">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
      <span class="lbl">Sobre mí</span><span class="dot"></span>
    </button>
    <button class="nav-item" data-target="experiencias-interactivas" data-color="blue">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9h17M8 9v10.5"/></svg>
      <span class="lbl">Experiencias</span><span class="dot"></span>
    </button>
    <button class="nav-item" data-target="apps-web" data-color="green">
      <svg viewBox="0 0 24 24"><path d="M9 8 4 12l5 4M15 8l5 4-5 4M13 5l-2 14"/></svg>
      <span class="lbl">Apps y web</span><span class="dot"></span>
    </button>
    <button class="nav-item" data-target="hardware" data-color="amber">
      <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/></svg>
      <span class="lbl">Hardware</span><span class="dot"></span>
    </button>
    <button class="nav-item" data-target="visual-3d" data-color="red">
      <svg viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9L12 3Z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/></svg>
      <span class="lbl">3D y visual</span><span class="dot"></span>
    </button>
    <button class="nav-item" data-target="contacto" data-color="neutral">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M4 6.5 12 13l8-6.5"/></svg>
      <span class="lbl">Contacto</span><span class="dot"></span>
    </button>
  </nav>

  <!-- Acá script.js inyecta el contenido de /sections/*.html -->
  <div class="scenes" id="scenesContainer"></div>

</div>

<!-- Todo el JS vive en script.js -->
<script src="script.js" defer></script>
</body>
</html>
